syntax = "proto3";

package kebab.auth.v1;

// User は User リソースの公開表現。
message User {
  string id = 1;
  string display_name = 4;
  string image_url = 5;
}

// SessionTokens は token 再発行結果。
message SessionTokens {
  string access_token = 1;
  string refresh_token = 2;
  string id_token = 3;
  int64 expires_in = 4;
  string token_type = 5;
}
